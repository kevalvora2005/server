<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{header}}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: Arial, sans-serif;">
  <div style="background-color: #f4f6f8; padding: 30px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
      <div style="background-color: #1a1f36; padding: 24px; text-align: center;">
        <h2 style="color: #ffffff; margin: 0; font-size: 22px;">{{header}}</h2>
      </div>
      <div style="padding: 30px;">
        <p style="font-size: 16px; margin-top: 0;">{{greeting}}</p>
        <p style="font-size: 15px; color: #555; line-height: 1.5;">
          {{body}}
        </p>

        <div style="background-color: #f8f9fa; border-left: 4px solid #1a1f36; padding: 20px; margin: 24px 0; border-radius: 4px; text-align: center;">
          <p style="margin: 0 0 8px 0; font-size: 14px; color: #666;">{{codeLabel}}</p>
          <p style="margin: 0; font-size: 36px; font-weight: bold; font-family: monospace; letter-spacing: 8px; color: #1a1f36;">{{code}}</p>
        </div>

        <p style="font-size: 14px; color: #666; line-height: 1.5;">
          {{expiryNote}}
        </p>
        <p style="font-size: 14px; color: #999; line-height: 1.5;">
          {{ignoreNote}}
        </p>
      </div>
      <div style="background-color: #f1f3f5; padding: 16px; text-align: center; font-size: 12px; color: #888;">
        <p style="margin: 0;">© {{year}} {{societyName}}. {{footer}}</p>
      </div>
    </div>
  </div>
</body>
</html>
